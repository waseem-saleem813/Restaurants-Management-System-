<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Overlay */
      .address-overlay {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 16px;
      }

      .address-overlay.active {
        display: flex;
      }

      /* Modal */
      .address-modal {
        background: #ffffff;
        width: 100%;
        max-width: 380px;
        border-radius: 12px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        position: relative;
        box-sizing: border-box;
        opacity: 0;
        transform: scale(0.92) translateY(10px);
        animation: modalPop 0.22s ease forwards;
        font-family: Arial, Helvetica, sans-serif;
      }

      @keyframes modalPop {
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      /* Close button */
      .close-btn {
        position: absolute;
        top: 10px;
        right: 12px;
        background: none;
        border: none;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        color: #555;
        padding: 4px;
      }

      .close-btn:hover {
        color: #000;
      }

      /* Title */
      .modal-title {
        font-size: 19px;
        margin: 0 0 14px 0;
        color: #111;
        font-weight: 600;
      }

      /* Field group */
      .field-group {
        margin-bottom: 12px;
      }

      .field-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #444;
        margin-bottom: 5px;
      }

      /* Text inputs & select */
      .text-input {
        width: 100%;
        height: 40px;
        border: 1px solid #d6d9de;
        border-radius: 8px;
        padding: 0 12px;
        font-size: 13px;
        box-sizing: border-box;
        outline: none;
        color: #111;
        background: #fff;
        transition: border-color 0.15s ease;
      }

      .text-input:focus {
        border-color: #2563eb;
      }

      /* Address Type Cards */
      .address-type-group {
        display: flex;
        gap: 10px;
      }

      .address-type-group input[type="radio"] {
        display: none;
      }

      .type-card {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 40px;
        border: 1px solid #d6d9de;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        color: #444;
        font-weight: 500;
        transition: all 0.15s ease;
        user-select: none;
      }

      .type-icon {
        font-size: 15px;
      }

      .address-type-group input[type="radio"]:checked + .type-card {
        background: #eaf1ff;
        border-color: #2563eb;
        color: #2563eb;
      }

      /* Save Button */
      .save-btn {
        width: 100%;
        height: 40px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 4px;
        transition: background 0.15s ease;
      }

      .save-btn:hover {
        background: #1d4ed8;
      }

      /* Mobile responsive */
      @media (max-width: 420px) {
        .address-modal {
          max-width: 100%;
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Modal Structure -->
    <div id="addressOverlay" class="address-overlay">
      <div class="address-modal">
        <button
          id="closeAddressModal"
          class="close-btn"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>

        <h2 class="modal-title">Add Address</h2>

        <form id="addressForm">
          <!-- Address Type -->
          <div class="field-group">
            <label class="field-label">Address Type</label>
            <div class="address-type-group">
              <input
                type="radio"
                name="addressType"
                id="typeHome"
                value="home"
                checked
              />
              <label for="typeHome" class="type-card">
                <span class="type-icon">🏠</span>
                <span>Home</span>
              </label>

              <input
                type="radio"
                name="addressType"
                id="typeOffice"
                value="office"
              />
              <label for="typeOffice" class="type-card">
                <span class="type-icon">🏢</span>
                <span>Office</span>
              </label>
            </div>
          </div>

          <!-- House / Office Number -->
          <div class="field-group">
            <label class="field-label" id="numberLabel" for="numberInput"
              >House Number</label
            >
            <input
              type="text"
              id="numberInput"
              class="text-input"
              placeholder="Enter house number"
              required
            />
          </div>

          <!-- Street -->
          <div class="field-group">
            <label class="field-label" for="streetInput">Street</label>
            <input
              type="text"
              id="streetInput"
              class="text-input"
              placeholder="Enter street name"
              required
            />
          </div>

          <!-- City -->
          <div class="field-group">
            <label class="field-label" for="cityInput">City</label>
            <select id="cityInput" class="text-input" required>
              <option value="Karachi">Karachi</option>
            </select>
          </div>

          <!-- Save Button -->
          <button type="submit" class="save-btn">Save Address</button>
        </form>
      </div>
    </div>
  </body>
</html>
